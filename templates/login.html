{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
    <form method="POST" action="/login">
        <input name="username" id="username" placeholder="Enter Username" required><br><br>
        <input type="password" name="password" id="password" placeholder="Enter Password" required><br><br>
        <button type="submit">Login</button>
    </form>

    <hr>

    <h3>Biometric Login</h3>
    <button onclick="biometricLogin()">Login with Biometrics</button>

    <script src="/static/webauthn.js"></script>
{% endblock %}
